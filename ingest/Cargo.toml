[package]
name = "lupa-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Downloads SERCOP OCDS bulk files and flattens them into Parquet tables"
license = "MIT"
publish = false

[lib]
name = "lupa_ingest"
path = "src/lib.rs"

[[bin]]
name = "lupa-ingest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.11"
hex = "0.4.3"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
